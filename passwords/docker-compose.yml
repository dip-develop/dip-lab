services:
  passwords:
    image: vaultwarden/server:latest
    container_name: passwords
    restart: always
    env_file:
      - .env
    ports:
      - "${BIND_IP:-0.0.0.0}:8200:80"
    environment:
      - DOMAIN=http://${BIND_IP:-0.0.0.0}:8200
      - SIGNUPS_ALLOWED=${PASSWORDS_SIGNUPS_ALLOWED}
      - ADMIN_TOKEN=${PASSWORDS_ADMIN_TOKEN}
      - RATE_LIMIT_SECONDS=3
      - RATE_LIMIT_BURST=10
    volumes:
      - ./data/passwords:/data
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.vaultwarden.rule=Host(`${DOMAIN:-vault.example.com}`)"
    #   - "traefik.http.routers.vaultwarden.entrypoints=websecure"
    #   - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

networks:
  internal:
    external: true