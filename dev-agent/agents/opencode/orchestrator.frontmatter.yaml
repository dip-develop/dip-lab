description: "Development coordination. Delegates planning, coding, testing and review to subagents; reads nothing itself. Use for any non-trivial feature or fix."
mode: primary
# Model: no pin. The agent inherits the session model.
# Coordinates only. It has no read, glob or grep access, so it never
# reads code itself: lookups go to the explore or planner subagent.
# Explicit shell denies below override the broad read allows in the
# shared list in opencode.jsonc (the agent rules are appended after it).
permissions:
  - action: "subagent"
    resource: "*"
    effect: deny
  - action: "subagent"
    resource: "planner"
    effect: allow
  - action: "subagent"
    resource: "coder"
    effect: allow
  - action: "subagent"
    resource: "tester"
    effect: allow
  - action: "subagent"
    resource: "reviewer"
    effect: allow
  - action: "subagent"
    resource: "architect"
    effect: allow
  - action: "subagent"
    resource: "explore"
    effect: allow
  - action: "edit"
    resource: "*"
    effect: ask
  - action: "read"
    resource: "*"
    effect: deny
  - action: "glob"
    resource: "*"
    effect: deny
  - action: "grep"
    resource: "*"
    effect: deny
  # Shell: deny by default. Only metadata commands are allowed. Reading file
  # contents through the shell (cat, head, sed, awk, sort, python, nl, xxd, ...)
  # is not allowed for this agent; a lookup goes to `explore` instead.
  - action: "shell"
    resource: "*"
    effect: deny
  - action: "shell"
    resource: "ls *"
    effect: allow
  - action: "shell"
    resource: "pwd *"
    effect: allow
  - action: "shell"
    resource: "date *"
    effect: allow
  - action: "shell"
    resource: "echo *"
    effect: allow
  - action: "shell"
    resource: "printf *"
    effect: allow
  - action: "shell"
    resource: "sleep *"
    effect: allow
  - action: "shell"
    resource: "which *"
    effect: allow
  - action: "shell"
    resource: "git status *"
    effect: allow
  - action: "shell"
    resource: "git branch --show-current *"
    effect: allow
  - action: "shell"
    resource: "gh pr view *"
    effect: allow
  - action: "shell"
    resource: "gh pr list *"
    effect: allow
  - action: "shell"
    resource: "gh pr checks *"
    effect: allow
  - action: "shell"
    resource: "gh issue list *"
    effect: allow
  # Last match wins: command substitution and redirection can smuggle a read
  # past the allow rules above, so these deny them explicitly.
  - action: "shell"
    resource: "*$(*"
    effect: deny
  - action: "shell"
    resource: "*`*"
    effect: deny
  - action: "shell"
    resource: "*<*"
    effect: deny
