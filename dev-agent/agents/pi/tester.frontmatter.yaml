name: tester
description: "Verification. Runs tests, lint and build and reports results; no edits. Use after each batch of edits."
advertise: true
defaultContext: fresh
tools: read, grep, find, ls, bash
extensions: /home/develop/.pi/agent/extensions/pi-permission-system/index.ts, /home/develop/.pi/agent/extensions/pi-sensitive-guard/index.ts
inheritProjectContext: true
inheritGlobalContext: true
inheritSkills: true
permission:
  tools:
    "read": allow
    "read:**/*.env": deny
    "read:**/*.env.*": deny
    "read:**/*.env.example": allow
    "grep": allow
    "grep:**/*.env": deny
    "grep:**/*.env.*": deny
    "grep:**/*.env.example": allow
    "find": allow
    "ls": allow
    "edit": deny
    "write": deny
    "subagent": deny
    "mcp": deny
  bash:
    "*": ask
    "ls *": allow
    "cat *": allow
    "head *": allow
    "tail *": allow
    "grep *": allow
    "rg *": allow
    "find *": allow
    "wc *": allow
    "sort *": allow
    "diff *": allow
    "echo *": allow
    "printf *": allow
    "sleep*": allow
    "true": allow
    "pwd": allow
    "git status*": allow
    "git diff*": allow
    "git log*": allow
    "git branch*": allow
    "dart analyze*": allow
    "dart format*": allow
    "dart test*": allow
    "dart pub get*": allow
    "dart pub upgrade*": allow
    "dart run *": allow
    "flutter test*": allow
    "flutter analyze*": allow
    "flutter pub *": allow
    "flutter build *": allow
    "flutter --version*": allow
    "serverpod generate*": allow
    "serverpod analyze*": allow
    "jaspr build*": allow
    "psql *": allow
    "mysql *": allow
    "mariadb *": allow
    "redis-cli *": allow
    "git push * main*": deny
    "git push * master*": deny
    "git push * develop*": deny
    "git push*--force*": deny
    "git push*-f": deny
    "git push*-f *": deny
    "git push*:main*": deny
    "git push*:master*": deny
    "git push*:develop*": deny
    "git push --delete*": deny
    "git push * --delete*": deny
    "git push :*": deny
    "git push * :*": deny
    "git filter-branch*": deny
    "git filter-repo*": deny
    "git update-ref*": deny
    "git reflog expire*": deny
    "gh secret*": deny
    "gh repo delete*": deny
    "gh release delete*": deny
    "gh workflow delete*": deny
    "gh auth token*": deny
    "gh auth status*--show-token*": deny
    "gh api*-X PUT*": deny
    "gh api*-X DELETE*": deny
    "gh api*-X PATCH*": deny
    "gh api*--method PUT*": deny
    "gh api*--method DELETE*": deny
    "gh api*--method PATCH*": deny
    "gh pr close*--delete-branch*": deny
    "cat *.env*": deny
    "head *.env*": deny
    "tail *.env*": deny
    "less *.env*": deny
    "sed *.env*": deny
    "rg *.env*": deny
    "grep *.env*": deny
    "printenv*": deny
