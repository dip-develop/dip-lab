name: explore
description: "Codebase lookup. Read-only, no shell. Use to find files and explain code instead of reading files yourself."
mode: subagent
permission:
  tools:
    "read": allow
    "grep": allow
    "find": allow
    "ls": allow
    "edit": deny
    "write": deny
    "task": deny
    "mcp": deny
  bash:
    "*": deny
