name: architect
description: "Architecture decisions. Read-only, no edits. Use for cross-module or new-subsystem design, before planner splits the work into steps."
advertise: true
defaultContext: fresh
tools: read, grep, find, ls, bash, mcp:dart, mcp:jaspr, mcp:serverpod, web_search, fetch_content, get_search_content
extensions: /home/develop/.pi/agent/extensions/pi-permission-system/index.ts, /home/develop/.pi/agent/extensions/pi-sensitive-guard/index.ts, /home/develop/.pi/agent/extensions/pi-web-access/dist/index.js
inheritProjectContext: true
inheritGlobalContext: true
inheritSkills: true
permission:
  tools:
    "read": allow
    "read:**/*.env": deny
    "read:**/*.env.*": deny
    "read:**/*.env.example": allow
    "grep": allow
    "grep:**/*.env": deny
    "grep:**/*.env.*": deny
    "grep:**/*.env.example": allow
    "find": allow
    "ls": allow
    "edit": deny
    "write": deny
    "subagent": deny
    "mcp": allow
    "mcp__dart__*": allow
    "mcp__jaspr__*": allow
    "mcp__serverpod__*": allow
  bash:
    "*": deny
    "git status *": allow
    "git log *": allow
    "git branch *": allow
    "git rev-list *": allow
    "git push * main*": deny
    "git push * master*": deny
    "git push * develop*": deny
    "git push*--force*": deny
    "git push*-f": deny
    "git push*-f *": deny
    "git push*:main*": deny
    "git push*:master*": deny
    "git push*:develop*": deny
    "git push --delete*": deny
    "git push * --delete*": deny
    "git push :*": deny
    "git push * :*": deny
    "git filter-branch*": deny
    "git filter-repo*": deny
    "git update-ref*": deny
    "git reflog expire*": deny
    "gh secret*": deny
    "gh repo delete*": deny
    "gh release delete*": deny
    "gh workflow delete*": deny
    "gh auth token*": deny
    "gh auth status*--show-token*": deny
    "gh api*-X PUT*": deny
    "gh api*-X DELETE*": deny
    "gh api*-X PATCH*": deny
    "gh api*--method PUT*": deny
    "gh api*--method DELETE*": deny
    "gh api*--method PATCH*": deny
    "gh pr close*--delete-branch*": deny
    "cat *.env*": deny
    "head *.env*": deny
    "tail *.env*": deny
    "less *.env*": deny
    "sed *.env*": deny
    "rg *.env*": deny
    "grep *.env*": deny
    "printenv*": deny
