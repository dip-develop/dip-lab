name: supper
description: "Full-autonomous senior developer. Runs tasks end-to-end without approval prompts and may spawn only itself as subagent for parallel work. Other agents cannot launch it."
mode: all
permission:
  tools:
    "read": allow
    "grep": allow
    "find": allow
    "ls": allow
    "edit": allow
    "write": allow
    "task": deny
    "mcp": allow
  bash:
    "*": allow
    "gh pr merge*": deny
    "git push * main*": deny
    "git push * master*": deny
    "git push * develop*": deny
    "git push*--force*": deny
    "git push*-f": deny
    "git push*-f *": deny
    "git push*:main*": deny
    "git push*:master*": deny
    "git push*:develop*": deny
    "git push --delete*": deny
    "git push * --delete*": deny
    "git push :*": deny
    "git push * :*": deny
    "git filter-branch*": deny
    "git filter-repo*": deny
    "git update-ref*": deny
    "git reflog expire*": deny
    "gh secret*": deny
    "gh repo delete*": deny
    "gh release delete*": deny
    "gh workflow delete*": deny
    "gh auth token*": deny
    "gh auth status*--show-token*": deny
    "gh api*-X PUT*": deny
    "gh api*-X DELETE*": deny
    "gh api*-X PATCH*": deny
    "gh api*--method PUT*": deny
    "gh api*--method DELETE*": deny
    "gh api*--method PATCH*": deny
    "gh pr close*--delete-branch*": deny
    "cat *.env*": deny
    "head *.env*": deny
    "tail *.env*": deny
    "less *.env*": deny
    "sed *.env*": deny
    "rg *.env*": deny
    "grep *.env*": deny
    "printenv*": deny
