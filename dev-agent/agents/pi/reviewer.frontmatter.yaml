name: reviewer
description: "Review. Checks diffs for correctness, style and open-core boundaries; no edits. Use before a change is merged."
mode: subagent
permission:
  tools:
    "read": allow
    "grep": allow
    "find": allow
    "ls": allow
    "edit": deny
    "write": deny
    "task": deny
    "mcp": deny
  bash:
    "*": ask
    "ls *": allow
    "cat *": allow
    "head *": allow
    "tail *": allow
    "grep *": allow
    "rg *": allow
    "find *": allow
    "wc *": allow
    "sort *": allow
    "uniq *": allow
    "diff *": allow
    "sed *": allow
    "awk *": allow
    "jq *": allow
    "tree *": allow
    "file *": allow
    "stat *": allow
    "echo *": allow
    "printf *": allow
    "true": allow
    "pwd": allow
    "git status*": allow
    "git diff*": allow
    "git log*": allow
    "git show *": allow
    "git branch*": allow
    "git grep *": allow
    "git remote*": allow
    "git ls-remote*": allow
    "git rev-parse*": allow
    "git ls-files*": allow
    "git blame*": allow
    "git fetch*": allow
    "git stash list*": allow
    "git stash show*": allow
    "git config --get*": allow
    "gh pr list*": allow
    "gh pr view*": allow
    "gh pr checks*": allow
    "gh pr diff*": allow
    "gh issue view*": allow
    "gh issue list*": allow
    "gh run list*": allow
    "gh run view*": allow
    "dart analyze*": allow
    "dart format*": allow
    "git push * main*": deny
    "git push * master*": deny
    "git push * develop*": deny
    "git push*--force*": deny
    "git push*-f": deny
    "git push*-f *": deny
    "git push*:main*": deny
    "git push*:master*": deny
    "git push*:develop*": deny
    "git push --delete*": deny
    "git push * --delete*": deny
    "git push :*": deny
    "git push * :*": deny
    "git filter-branch*": deny
    "git filter-repo*": deny
    "git update-ref*": deny
    "git reflog expire*": deny
    "gh secret*": deny
    "gh repo delete*": deny
    "gh release delete*": deny
    "gh workflow delete*": deny
    "gh auth token*": deny
    "gh auth status*--show-token*": deny
    "gh api*-X PUT*": deny
    "gh api*-X DELETE*": deny
    "gh api*-X PATCH*": deny
    "gh api*--method PUT*": deny
    "gh api*--method DELETE*": deny
    "gh api*--method PATCH*": deny
    "gh pr close*--delete-branch*": deny
    "cat *.env*": deny
    "head *.env*": deny
    "tail *.env*": deny
    "less *.env*": deny
    "sed *.env*": deny
    "rg *.env*": deny
    "grep *.env*": deny
    "printenv*": deny
