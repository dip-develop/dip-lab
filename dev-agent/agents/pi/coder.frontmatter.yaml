name: coder
description: "Implementation. Edits files and runs allowed commands; no pushes or merges. Use for one planner step, which may touch several files."
mode: subagent
permission:
  tools:
    "read": allow
    "grep": allow
    "find": allow
    "ls": allow
    "edit": allow
    "write": allow
    "task": deny
    "mcp": allow
  bash:
    "*": ask
    "ls *": allow
    "cat *": allow
    "head *": allow
    "tail *": allow
    "grep *": allow
    "rg *": allow
    "sed *": allow
    "find *": allow
    "wc *": allow
    "sort *": allow
    "diff *": allow
    "mkdir *": allow
    "cp *": allow
    "printf *": allow
    "echo *": allow
    "sleep*": allow
    "true": allow
    "pwd": allow
    "git status*": allow
    "git diff*": allow
    "git log*": allow
    "git show *": allow
    "git branch*": allow
    "git checkout *": allow
    "git add *": allow
    "git commit *": allow
    "git stash *": allow
    "git rm *": allow
    "git merge *": allow
    "git rebase *": allow
    "git fetch*": allow
    "git pull*": allow
    "git rev-parse*": allow
    "git ls-files*": allow
    "git push *": allow
    "gh pr create*": allow
    "gh pr edit*": allow
    "gh pr view*": allow
    "gh pr list*": allow
    "gh pr checks*": allow
    "gh pr comment*": allow
    "gh pr status*": allow
    "gh issue view*": allow
    "gh issue list*": allow
    "gh run view*": allow
    "gh run list*": allow
    "dart analyze*": allow
    "dart format*": allow
    "dart test*": allow
    "dart pub *": allow
    "flutter test*": allow
    "flutter analyze*": allow
    "flutter pub *": allow
    "flutter doctor*": allow
    "flutter devices*": allow
    "flutter --version*": allow
    "serverpod generate*": allow
    "serverpod analyze*": allow
    "jaspr build*": allow
    "gh pr merge*": deny
    "git push * main*": deny
    "git push * master*": deny
    "git push * develop*": deny
    "git push*--force*": deny
    "git push*-f": deny
    "git push*-f *": deny
    "git push*:main*": deny
    "git push*:master*": deny
    "git push*:develop*": deny
    "git push --delete*": deny
    "git push * --delete*": deny
    "git push :*": deny
    "git push * :*": deny
    "git filter-branch*": deny
    "git filter-repo*": deny
    "git update-ref*": deny
    "git reflog expire*": deny
    "gh secret*": deny
    "gh repo delete*": deny
    "gh release delete*": deny
    "gh workflow delete*": deny
    "gh auth token*": deny
    "gh auth status*--show-token*": deny
    "gh api*-X PUT*": deny
    "gh api*-X DELETE*": deny
    "gh api*-X PATCH*": deny
    "gh api*--method PUT*": deny
    "gh api*--method DELETE*": deny
    "gh api*--method PATCH*": deny
    "gh pr close*--delete-branch*": deny
    "cat *.env*": deny
    "head *.env*": deny
    "tail *.env*": deny
    "less *.env*": deny
    "sed *.env*": deny
    "rg *.env*": deny
    "grep *.env*": deny
    "printenv*": deny
