server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: 'traefik-logs'
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          __path__: /srv/proxy/logs/*.log

  - job_name: 'system-logs'
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          __path__: /var/log/*.log