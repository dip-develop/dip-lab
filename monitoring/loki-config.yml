auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  compactor_address: http://loki:3100

storage:
  type: filesystem
  filesystem:
    directory: /loki/chunks

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h