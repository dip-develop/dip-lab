global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "vaultwarden"
    static_configs:
      - targets: ["vaultwarden:80"]

  - job_name: "nextcloud"
    static_configs:
      - targets: ["nextcloud:80"]

  - job_name: "immich"
    static_configs:
      - targets: ["immich-server:2283"]

  - job_name: "paperless"
    static_configs:
      - targets: ["paperless:8000"]

  - job_name: "n8n"
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: "portainer"
    static_configs:
      - targets: ["portainer:9000"]

remote_write:
  - url: "http://loki:3100/api/v1/push"
