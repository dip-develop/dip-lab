services:
  cloud:
    image: seafileltd/seafile-mc:13.0.21
    container_name: cloud
    user: "1000:1000"
    restart: always
    env_file:
      - .env
    command: >
      bash -c "
        chown -R 1000:1000 /shared/seafile/seafile-data 2>/dev/null;
        exec /sbin/my_init -- /scripts/enterpoint.sh
      "
    environment:
      - DB_HOST=mysql
      - SEAFILE_SERVER_PROTOCOL=http
      - SEAFILE_SERVER_HOSTNAME=${BIND_IP:-0.0.0.0}:8383
      - TIME_ZONE=${TZ}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - SEAFILE_MYSQL_DB_HOST=mysql
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=${MYSQL_USER}
      - SEAFILE_MYSQL_DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_ROOT_PASSWD=${MYSQL_ROOT_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INIT_SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_USE_S3=${SEAFILE_USE_S3:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PATH_STYLE_REQUEST=${S3_PATH_STYLE_REQUEST:-}
    volumes:
      - ./data/cloud:/shared
      # Object Storage — use Seafile's native S3 backend (SEAFILE_USE_S3=1 in .env)
      # instead of FUSE mounts, which break Unix permissions
      # Cross-service access - read other services' data (uncomment to enable)
      - /mnt/object-storage/data/gallery/upload:/mnt/gallery:ro
      - /mnt/object-storage/data/docs:/mnt/docs:ro
    ports:
      - "${BIND_IP:-0.0.0.0}:8383:80"
      - "${BIND_IP:-0.0.0.0}:8386:8000"
    networks:
      - internal
      - database
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.seafile.rule=Host(`${DOMAIN:-cloud.example.com}`)"
    #   - "traefik.http.routers.seafile.entrypoints=websecure"
    #   - "traefik.http.routers.seafile.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.seafile.loadbalancer.server.port=80"

  memcached:
    image: memcached:1.6-alpine
    container_name: cloud-memcached
    restart: always
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  database:
    external: true
  internal:
    external: true
