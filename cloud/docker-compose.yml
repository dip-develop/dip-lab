services:
  cloud:
    image: seafileltd/seafile-mc:latest
    container_name: cloud
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - SEAFILE_SERVER_HOSTNAME=${BIND_IP:-0.0.0.0}:8383
      - TIME_ZONE=${TZ}
      - SEAFILE_MYSQL_DB_HOST=mysql
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=${MYSQL_USER}
      - SEAFILE_MYSQL_DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_ROOT_PASSWD=${MYSQL_ROOT_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=${BIND_IP:-0.0.0.0}:8383
    volumes:
      - ./data/cloud:/shared
      # Object Storage - large files (uncomment to enable)
      # Seafile stores files in /shared/seafile-data
      # Use S3 backend in .env for object storage instead of local mount
      # - /mnt/object-storage/data/cloud/seafile-data:/shared/seafile-data
      # Cross-service access - read other services' data (uncomment to enable)
      # - /mnt/object-storage/data/gallery/upload:/mnt/gallery:ro
      # - /mnt/object-storage/data/docs:/mnt/docs:ro
    ports:
      - "${BIND_IP:-0.0.0.0}:8385:80"
      - "${BIND_IP:-0.0.0.0}:8386:8000"
    networks:
      - internal
      - database
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.seafile.rule=Host(`${DOMAIN:-cloud.example.com}`)"
    #   - "traefik.http.routers.seafile.entrypoints=websecure"
    #   - "traefik.http.routers.seafile.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.seafile.loadbalancer.server.port=80"

  memcached:
    image: memcached:1.6-alpine
    container_name: cloud-memcached
    restart: always
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  database:
    external: true
  internal:
    external: true