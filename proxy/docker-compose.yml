services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    env_file:
      - .env
    ports:
      - "4080:80"
      - "4443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./logs:/var/log/traefik
      - ./acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["/docker-entrypoint.sh", "--config-file=/etc/traefik/traefik.yml"]
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  web:
    external: true