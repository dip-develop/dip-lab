services:
  traefik:
    image: traefik:v3.7.0-rc.1
    container_name: traefik
    restart: always
    ports:
      - "4080:80"
      - "4443:443"
    volumes:
      - /srv/proxy/traefik.yml:/etc/traefik/traefik.yml:ro
      - /srv/proxy/dynamic:/etc/traefik/dynamic:ro
      - /srv/proxy/acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/proxy/logs:/var/log/traefik
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  web:
    external: true
