services:
  traefik:
    image: traefik:v3.7.0.10
    container_name: traefik
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ./logs:/var/log/traefik
      - ./acme.json:/etc/traefik/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        chmod 600 /etc/traefik/acme.json 2>/dev/null || true;
        /entrypoint.sh traefik
    command: ""
    networks:
      - web
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

networks:
  web:
    external: true
  internal:
    external: true