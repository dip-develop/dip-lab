global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

log:
  level: INFO
  format: common

accessLog:
  format: common

ping:
  entryPoint: web

entryPoints:
  web:
    address: "10.0.0.1:80"
  websecure:
    address: "10.0.0.1:443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: web
  file:
    directory: /etc/traefik/dynamic
    watch: true
