services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE_NAME=${IMMICH_DB_NAME}
      - REDIS_HOSTNAME=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - UPLOAD_LOCATION=/data/upload
    volumes:
      - ./data/immich/upload:/data/upload
      - ./data/immich/thumbs:/data/thumbs
      - ./data/immich/profile:/data/profile
      - /mnt/object-storage/data/immich/library:/mnt/object-storage/library:ro
    networks:
      - web
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.immich.rule=Host(`photos.dm-home.de`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2283/api/server-info/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    restart: always
    volumes:
      - ./data/immich/ml-cache:/cache
    networks:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  web:
    external: true
  database:
    external: true