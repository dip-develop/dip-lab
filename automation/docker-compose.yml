services:
  automation:
    image: n8nio/n8n:latest
    container_name: automation
    restart: always
    env_file:
      - .env
    environment:
      - N8N_HOST=${DOMAIN:-automation.example.com}:5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN:-automation.example.com}/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${AUTOMATION_DB_NAME}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${AUTOMATION_ENCRYPTION_KEY}
      - N8N_TRUST_PROXY=true
      - N8N_RATE_LIMIT=100
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./data/automation:/home/node/.n8n:rw
      # Object Storage - large execution data (uncomment to enable)
      # - /mnt/object-storage/data/automation:/mnt/object-storage:rw
      # Cross-service access - read other services' data (uncomment to enable)
      # - ../cloud/data/cloud:/mnt/cloud:ro
      # - ../gallery/data/gallery:/mnt/gallery:ro
      # - ../docs/data/docs:/mnt/docs:ro
    ports:
      - "${BIND_IP:-0.0.0.0}:5678:5678"
    networks:
      - internal
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.n8n.rule=Host(`${DOMAIN:-automation.example.com}`)"
    #   - "traefik.http.routers.n8n.entrypoints=websecure"
    #   - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.n8n.loadbalancer.server.port=5678"

networks:
  database:
    external: true
  internal:
    external: true