services:
  nextcloud:
    image: nextcloud:32-apache
    container_name: nextcloud
    restart: always
    env_file:
      - .env
    ports:
      - "8080:80"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${NEXTCLOUD_DB_NAME}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=10.*.*.*
      - OVERWRITEHOST=${NEXTCLOUD_INTERNAL_HOST}
      - OVERWRITEPROTOCOL=http
    volumes:
      - ./data/nextcloud/app:/var/www/html
      - ./data/nextcloud/data:/var/www/html/data
      - /mnt/object-storage/data/nextcloud:/mnt/object-storage:ro
    networks:
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  database:
    external: true
