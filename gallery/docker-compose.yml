services:
  gallery-server:
    image: ghcr.io/immich-app/immich-server:v2
    container_name: gallery-server
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOSTNAME=postgres
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_DATABASE_NAME=${GALLERY_DB_NAME}
      - REDIS_HOSTNAME=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - UPLOAD_LOCATION=/data/upload
    volumes:
      # - ./data/gallery/upload:/data/upload
      - ./data/gallery/thumbs:/data/thumbs
      - ./data/gallery/profile:/data/profile
      # Object Storage - large media files (uncomment to enable)
      # Large files stored in S3-compatible storage, small files stay on NVMe
      - /mnt/object-storage/data/gallery/upload:/data/upload:consistent
      - /mnt/object-storage/data/gallery/thumbs:/data/thumbs
      - /mnt/object-storage/data/gallery/backup:/data/backup
      - /mnt/object-storage/data/gallery/library:/data/library
      - /mnt/object-storage/data/gallery/encoded-video:/data/encoded-video
    ports:
      - "${BIND_IP:-0.0.0.0}:2283:2283"
    networks:
      - internal
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2283/api/server-info/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.immich.rule=Host(`${DOMAIN:-gallery.example.com}`)"
    #   - "traefik.http.routers.immich.entrypoints=websecure"
    #   - "traefik.http.routers.immich.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.immich.loadbalancer.server.port=2283"

  gallery-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: gallery-ml
    restart: always
    volumes:
      - ./data/gallery/ml-cache:/cache
    networks:
      - internal
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

networks:
  database:
    external: true
  internal:
    external: true