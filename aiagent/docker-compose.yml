services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: always
    env_file:
      - .env
    ports:
      - "${BIND_IP:-127.0.0.1}:18789:8642"
      - "${BIND_IP:-127.0.0.1}:18790:9119"
    volumes:
      - ./data/aiagent:/opt/data
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD=1
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.hermes.rule=Host(`${DOMAIN:-ai.example.com}`)"
    #   - "traefik.http.routers.hermes.entrypoints=websecure"
    #   - "traefik.http.routers.hermes.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.hermes.loadbalancer.server.port=8642"

  aiagent:
  # Note: Keeping for backward compatibility, points to hermes service
    image: nginx:alpine
    container_name: aiagent-alias
    restart: always
    networks:
      - internal

networks:
  internal:
    external: true