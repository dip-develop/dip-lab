services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    command: gateway run
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BIND_IP:-0.0.0.0}:18789:8642"
      - "${BIND_IP:-0.0.0.0}:18790:9119"
    volumes:
      - ./data/aiagent:/opt/data
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD_HOST=${BIND_IP:-0.0.0.0}
    networks:
      - internal
    tty: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8642/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.hermes.rule=Host(`${DOMAIN:-ai.example.com}`)"
    #   - "traefik.http.routers.hermes.entrypoints=websecure"
    #   - "traefik.http.routers.hermes.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.hermes.loadbalancer.server.port=8642"

