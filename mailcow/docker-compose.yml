version: '3.8'

services:
  mailcow-dockerized:
    image: mailcow/mailcow-dockerized:2026-03
    container_name: mailcow
    restart: always
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${SMTP_PORT}:25"
      - "${SMTPS_PORT}:465"
      - "${SUBMISSION_PORT}:587"
      - "${IMAP_PORT}:143"
      - "${IMAPS_PORT}:993"
      - "${POP_PORT}:110"
      - "${POPS_PORT}:995"
      - "${SIEVE_PORT}:4190"
      - "${DOVEVOT_PORT}:9993"
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./data/mailcow/data:/var/lib/docker
      - ./data/mailcow/mail:/var/mail
      - ./data/mailcow/postfix:/var/spool/postfix
      - ./data/mailcow/dovecot:/var/lib/dovecot
      - ./data/mailcow/redis:/var/lib/redis
      - ./data/mailcow/filter:/var/milterd
      - ./data/mailcow/solr:/var/lib/solr
      - ./data/mailcow/mysql:/var/lib/mysql
    env_file:
      - ./mailcow.env
    dns:
      - 127.0.0.1
    networks:
      - mailcow
      - web
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailcow-http.rule=Host(`mail.dipdev.de`)"
      - "traefik.http.routers.mailcow-http.entrypoints=web"
      - "traefik.http.routers.mailcow-https.rule=Host(`mail.dipdev.de`)"
      - "traefik.http.routers.mailcow-https.entrypoints=websecure"
      - "traefik.http.routers.mailcow-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.mailcow.loadbalancer.server.port=${HTTPS_PORT}"
    shm_size: 128m
    environment:
      TZ: Europe/Kiev

networks:
  mailcow:
    driver: bridge
    name: mailcow
  web:
    external: true