services:
  portainer:
    image: portainer/portainer-ce:2.40.0
    container_name: portainer
    restart: always
    command: --http-enabled --bind :9000
    ports:
      - "10.0.0.1:9000:9000"
    env_file:
      - .env
    environment:
      - PORTAINER_ADMIN_PASSWORD=${PORTAINER_ADMIN_PASSWORD}
    volumes:
      - ./data/portainer:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

networks:
  internal:
    external: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3


