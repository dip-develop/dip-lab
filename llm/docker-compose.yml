services:
  llama:
    image: ghcr.io/ggerganov/llama.cpp:latest
    container_name: llama
    restart: always

    ports:
      - "${BIND_IP:-0.0.0.0}:8001:8080"

    volumes:
      - ./data/llm/models:/models

    command: >
      --hf-repo second-state/gemma-2b-it-gguf
      --hf-file gemma-2b-it.Q4_K_M.gguf
      --model /models/gemma-2b-it.Q4_K_M.gguf
      --ctx-size 4096
      --threads 8
      --parallel 2
      --host 0.0.0.0
      --port 8080

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - internal

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

networks:
  internal:
    external: true