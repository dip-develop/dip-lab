services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: always
    command: >
      --model google/gemma-4-E4B-it
      --dtype bfloat16
      --max-model-len 4096
      --tensor-parallel-size 1
    expose:
      - "8000"
    volumes:
      - /srv/llm/models:/root/.cache/huggingface
    environment:
      - VLLM_CPU_KVCACHE_SPACE=3
      - VLLM_LOG_LEVEL=INFO
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6G

networks:
  internal:
    external: true