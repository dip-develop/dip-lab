services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: always
    ports:
      - "${BIND_IP:-0.0.0.0}:8001:8000"
    volumes:
      - ./data/llm/models:/models
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_API_KEY=
    command: --model google/gemma-4-2b-it --dtype half --enforce-eager --host 0.0.0.0 --port 8000
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.vllm.rule=Host(`${DOMAIN:-vllm.example.com}`)"
    #   - "traefik.http.routers.vllm.entrypoints=websecure"
    #   - "traefik.http.routers.vllm.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.vllm.loadbalancer.server.port=8000"

networks:
  internal:
    external: true