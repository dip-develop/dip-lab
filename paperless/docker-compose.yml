services:
  paperless:
    image: paperlessngx/paperless-ngx:2.20.13
    container_name: paperless
    restart: always
    env_file:
      - .env
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
      - PAPERLESS_URL=https://docs.dm-home.de
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_TIME_ZONE=Europe/Kiev
      - PAPERLESS_OCR_LANGUAGE=ukr,eng
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://paperless-tika:9998
    volumes:
      - /srv/paperless/data:/usr/src/paperless/data
      - /mnt/object-storage/data/paperless/media:/usr/src/paperless/media:ro
      - /srv/paperless/export:/usr/src/paperless/export
      - /srv/paperless/consume:/usr/src/paperless/consume
    networks:
      - paperless_internal
      - web
    depends_on:
      - paperless-db
      - paperless-redis
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.paperless.rule=Host(`docs.dm-home.de`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.tls.certresolver=letsencrypt"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  paperless-db:
    image: postgres:16
    container_name: paperless-db
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
    volumes:
      - /srv/paperless/db:/var/lib/postgresql/data
    networks:
      - paperless_internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "paperless"]
      interval: 30s
      timeout: 10s
      retries: 3

  paperless-redis:
    image: redis:alpine
    container_name: paperless-redis
    restart: always
    networks:
      - paperless_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  paperless-gotenberg:
    image: gotenberg/gotenberg:8.30.0
    container_name: paperless-gotenberg
    restart: always
    networks:
      - paperless_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  paperless-tika:
    image: apache/tika:3.2.3.0
    container_name: paperless-tika
    restart: always
    networks:
      - paperless_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  web:
    external: true
  paperless_internal:
    driver: bridge
    name: paperless_internal