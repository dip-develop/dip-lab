services:
  paperless:
    image: paperlessngx/paperless-ngx:2.20.13
    container_name: paperless
    restart: always
    env_file:
      - .env
    environment:
      - PAPERLESS_REDIS=redis://:${REDIS_PASSWORD}@redis:6379
      - PAPERLESS_DBHOST=postgres
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME}
      - PAPERLESS_DBUSER=${POSTGRES_USER}
      - PAPERLESS_DBPASS=${POSTGRES_PASSWORD}
      - PAPERLESS_URL=https://paperless.dm-home.de
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_TIME_ZONE=${TZ}
      - PAPERLESS_OCR_LANGUAGE=ukr,eng
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://paperless-gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://paperless-tika:9998
    volumes:
      - ./data/paperless/data:/usr/src/paperless/data
      - ./data/paperless/export:/usr/src/paperless/export
      - ./data/paperless/consume:/usr/src/paperless/consume
    ports:
      - "10.0.0.1:8000:8000"
    networks:
      - internal
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  paperless-gotenberg:
    image: gotenberg/gotenberg:8.30.0
    container_name: paperless-gotenberg
    restart: always
    networks:
      - internal
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  paperless-tika:
    image: apache/tika:3.2.3.0
    container_name: paperless-tika
    restart: always
    networks:
      - internal
      - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  database:
    external: true
  internal:
    external: true
