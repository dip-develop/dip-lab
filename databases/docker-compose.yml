services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
      # Used by postgres-entrypoint.sh to substitute placeholders in
      # init.sql. Never hardcode these in init.sql - they belong in .env.
      - TEST_POSTGRES_USER=${TEST_POSTGRES_USER:-}
      - TEST_POSTGRES_PASSWORD=${TEST_POSTGRES_PASSWORD:-}
      - TEST_POSTGRES_DB=${TEST_POSTGRES_DB:-}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres-entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
    # postgres-entrypoint.sh substitutes ${TEST_*} placeholders in
    # init.sql with real values from .env, then execs the original
    # postgres entrypoint.
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=2GB
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # Used by entrypoint.sh to substitute placeholders in mysql-init.sql.
      # Never hardcode these in mysql-init.sql - they belong in .env.
      - MYSQL_CLOUD_PASSWORD=${MYSQL_CLOUD_PASSWORD}
      - TEST_MYSQL_USER=${TEST_MYSQL_USER:-}
      - TEST_MYSQL_PASSWORD=${TEST_MYSQL_PASSWORD:-}
      - TEST_MYSQL_DB=${TEST_MYSQL_DB:-}
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    # entrypoint.sh runs envsubst on mysql-init.sql (replacing the
    # __MYSQL_*_PASSWORD__ placeholders with real values from .env),
    # then execs the original MySQL entrypoint.
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000 --loglevel warning
    volumes:
      - ./data/redis:/data
    networks:
      - database
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

networks:
  database:
    external: true

