services:
  email:
    image: stalwartlabs/stalwart:v1
    container_name: email
    restart: unless-stopped
    init: true
    env_file:
      - .env
    # security_opt: no-new-privileges omitted so UID 2000 can bind low mail
    # ports (<1024) via the binary's cap_net_bind_service file capability
    # (dev-agent precedent). No cap_drop.
    ports:
      # Mail ports are TCP and published directly, NOT proxied by Traefik.
      - "${BIND_IP:-0.0.0.0}:25:25"
      - "${BIND_IP:-0.0.0.0}:465:465"
      - "${BIND_IP:-0.0.0.0}:993:993"
      - "${BIND_IP:-0.0.0.0}:995:995"
      - "${BIND_IP:-0.0.0.0}:4190:4190"
      # Setup/recovery HTTP wizard on loopback only.
      - "127.0.0.1:${EMAIL_SETUP_PORT:-8080}:8080"
    volumes:
      - ./data/etc:/etc/stalwart
      - ./data/data:/var/lib/stalwart
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:443/healthz/live || curl -fsS http://127.0.0.1:8080/healthz/live"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.email.rule=Host(`${DOMAIN:-mail.example.com}`)"
      - "traefik.http.routers.email.entrypoints=websecure"
      - "traefik.http.routers.email.tls.certresolver=letsencrypt"
      - "traefik.http.services.email.loadbalancer.server.port=443"
      # Mail ports (25/465/993/995/4190) are TCP and NOT proxied by Traefik;
      # they are published directly above.

networks:
  internal:
    external: true
  web:
    external: true