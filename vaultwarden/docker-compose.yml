services:
  vaultwarden:
    image: vaultwarden/server:1.35.4
    container_name: vaultwarden
    restart: always
    env_file:
      - .env
    ports:
      - "10.0.0.1:8200:80"
    environment:
      - DOMAIN=http://10.0.0.1:8200
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - RATE_LIMIT_SECONDS=3
      - RATE_LIMIT_BURST=10
    volumes:
      - ./data/vaultwarden:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

networks:
  internal:
    external: true
